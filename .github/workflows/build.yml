name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          if [ -f MyTV.zip ]; then
            unzip -o -q MyTV.zip -d .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Load signing key from secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            PASS="${SIGNING_KEY%%:*}"
            echo "::add-mask::$PASS"
            echo "${SIGNING_KEY#*:}" | base64 -d > "$RUNNER_TEMP/abu.keystore"
            echo "SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/abu.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEY secret is missing"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk AbuMuath.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuMuath-apk
          path: AbuMuath.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AbuMuath v${{ github.run_number }}
          files: AbuMuath.apk
          make_latest: true
